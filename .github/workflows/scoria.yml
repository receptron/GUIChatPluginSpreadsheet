name: scoria

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Measures with scoria, uploads the findings to code scanning and publishes the README badge.
  # The project's code runs only in the workflow's read-only job; see the workflow for how the
  # write permissions below are split between its upload and badge jobs.
  scoria:
    uses: isamu/lab/.github/workflows/scoria-measure.yml@8e8a2ebe9b1a1909c894359cc0a33b168bbb4116
    permissions:
      contents: write
      security-events: write
    with:
      # scoria only reads an existing coverage report (coverage/lcov.info); it never runs the tests itself.
      before: yarn run test:coverage
      scoria: yarn run quality
